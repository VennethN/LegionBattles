# Builds the game and publishes it to GitHub Pages, so that it can be played
# from a link: https://<owner>.github.io/<repository>/
#
# Pages has to be switched on once, by hand: Settings, Pages, "Build and
# deployment", Source: GitHub Actions. Until it is, this run fails at
# "Set up Pages".
#
# A push that changes only docs starts no run, and a push while a run is
# going takes that run's place.

name: Publish to GitHub Pages

on:
  push:
    branches: ['claude/eloquent-pascal-k1epdv', 'main']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
