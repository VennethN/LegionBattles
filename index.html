<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Lastander</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo/mark.svg" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #2a1a10; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; }
      /* The canvas fills the window whatever size it is drawn at: the game makes it as dense as the screen (src/view/config.ts). */
      #game canvas { display: block; width: 100% !important; height: 100% !important; }
      /* The game's mark, turning, from the first moment the page is up until the game draws its own: never a loading bar. */
      #boot-mark { position: fixed; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; animation: turn 1.4s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <img id="boot-mark" src="./assets/logo/mark.svg" alt="" />
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
