<svg xmlns="http://www.w3.org/2000/svg" id="bolt" width="46" height="12" viewBox="0 0 46 12">
<defs>
<path id="bolt-shaft-shape" d="M 4 4.5 L 36.8 4.5 L 36.8 7.5 L 4 7.5 Z"/>
<path id="bolt-head-shape" d="M 35 1.8 L 44 6 L 35 10.2 Z"/>
