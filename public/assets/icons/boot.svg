<svg xmlns="http://www.w3.org/2000/svg" id="boot" width="48" height="48" viewBox="0 0 48 48">
<defs>
<path id="boot-boot-shape" d="M 13 6 L 29 6 L 29 24 C 38 25 43 30 43 37 L 43 42 L 11 42 L 11 30 Z"/>
<clipPath id="boot-boot-clip"><use href="#boot-boot-shape"/></clipPath>
<clipPath id="boot-boot-lit-clip"><use href="#boot-boot-shape" transform="translate(-4 -4)"/></clipPath>
<path id="boot-cuff-shape" d="M 14 4 L 28 4 Q 31 4 31 7 L 31 9 Q 31 12 28 12 L 14 12 Q 11 12 11 9 L 11 7 Q 11 4 14 4 Z"/>
</defs>
