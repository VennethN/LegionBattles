<svg xmlns="http://www.w3.org/2000/svg" id="sound" width="48" height="48" viewBox="0 0 48 48">
<defs>
<path id="sound-cone-shape" d="M 6 18 L 16 18 L 27 8 L 27 40 L 16 30 L 6 30 Z"/>
<clipPath id="sound-cone-clip"><use href="#sound-cone-shape"/></clipPath>
<clipPath id="sound-cone-lit-clip"><use href="#sound-cone-shape" transform="translate(-3 -3)"/></clipPath>
<path id="sound-wave-a-shape" d="M 32 17 C 37 21 37 27 32 31 L 29 28 C 31 26 31 22 29 20 Z"/>
<path id="sound-wave-b-shape" d="M 38 11 C 47 18 47 30 38 37 L 35 34 C 41 29 41 19 35 14 Z"/>
</defs>
<g id="sound-cone">
<use id="sound-cone-shade" href="#sound-cone-shape" fill="#c4b594"/>
<g clip-path="url(#sound-cone-clip)">
<use id="sound-cone-fill" href="#sound-cone-shape" transform="translate(-3 -3)" fill="#e9dfc6"/>
<g clip-path="url(#sound-cone-lit-clip)">
<use id="sound-cone-lit" href="#sound-cone-shape" transform="translate(-3 -3)" fill="#f4f1e4" opacity="0.36"/>
<use id="sound-cone-fill-over" href="#sound-cone-shape" transform="translate(3.6 3.6)" fill="#e9dfc6"/>
</g>
</g>
<use id="sound-cone-line" href="#sound-cone-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="sound-wave-a">
<use id="sound-wave-a-fill" href="#sound-wave-a-shape" fill="#e9dfc6"/>
<use id="sound-wave-a-line" href="#sound-wave-a-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="sound-wave-b">
<use id="sound-wave-b-fill" href="#sound-wave-b-shape" fill="#e9dfc6"/>
<use id="sound-wave-b-line" href="#sound-wave-b-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
