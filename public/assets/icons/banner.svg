<use id="banner-flag-lit" href="#banner-flag-shape" transform="translate(-3 -3)" fill="#f4f1e4" opacity="0.36"/>
<use id="banner-flag-fill-over" href="#banner-flag-shape" transform="translate(3.6 3.6)" fill="#c2453a"/>
</g>
</g>
<use id="banner-flag-line" href="#banner-flag-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
