<svg xmlns="http://www.w3.org/2000/svg" id="banner" width="48" height="48" viewBox="0 0 48 48">
<defs>
<path id="banner-pole-shape" d="M 12 4 L 12 4 Q 15 4 15 7 L 15 42 Q 15 45 12 45 L 12 45 Q 9 45 9 42 L 9 7 Q 9 4 12 4 Z"/>
<path id="banner-flag-shape" d="M 14 7 L 42 9 L 34 18 L 42 28 L 14 30 Z"/>
<clipPath id="banner-flag-clip"><use href="#banner-flag-shape"/></clipPath>
<clipPath id="banner-flag-lit-clip"><use href="#banner-flag-shape" transform="translate(-3 -3)"/></clipPath>
</defs>
<g id="banner-pole">
<use id="banner-pole-fill" href="#banner-pole-shape" fill="#9a6a3a"/>
