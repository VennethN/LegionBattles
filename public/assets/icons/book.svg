<use id="book-cover-lit" href="#book-cover-shape" transform="translate(-4 -4)" fill="#f4f1e4" opacity="0.36"/>
<use id="book-cover-fill-over" href="#book-cover-shape" transform="translate(4.2 4.2)" fill="#3d6fb6"/>
</g>
</g>
<use id="book-cover-line" href="#book-cover-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="book-spine">
