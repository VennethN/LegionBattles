<svg xmlns="http://www.w3.org/2000/svg" id="book" width="48" height="48" viewBox="0 0 48 48">
<defs>
<path id="book-pages-shape" d="M 12 34 L 39 34 Q 41 34 41 36 L 41 41 Q 41 43 39 43 L 12 43 Q 10 43 10 41 L 10 36 Q 10 34 12 34 Z"/>
<path id="book-cover-shape" d="M 12 5 L 37 5 Q 41 5 41 9 L 41 35 Q 41 39 37 39 L 12 39 Q 8 39 8 35 L 8 9 Q 8 5 12 5 Z"/>
