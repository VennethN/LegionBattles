<g id="book-pages">
<use id="book-pages-fill" href="#book-pages-shape" fill="#e9dfc6"/>
<use id="book-pages-line" href="#book-pages-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="book-cover">
<use id="book-cover-shade" href="#book-cover-shape" fill="#2f5893"/>
