<path id="book-spine-shape" d="M 11 5 L 13 5 Q 16 5 16 8 L 16 40 Q 16 43 13 43 L 11 43 Q 8 43 8 40 L 8 8 Q 8 5 11 5 Z"/>
<path id="book-clasp-shape" d="M 28 12 L 30.8 18.2 L 37 21 L 30.8 23.8 L 28 30 L 25.2 23.8 L 19 21 L 25.2 18.2 Z"/>
