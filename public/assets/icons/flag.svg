<svg xmlns="http://www.w3.org/2000/svg" id="flag" width="48" height="48" viewBox="0 0 48 48">
<defs>
<path id="flag-pole-shape" d="M 13 4 L 13 4 Q 16 4 16 7 L 16 42 Q 16 45 13 45 L 13 45 Q 10 45 10 42 L 10 7 Q 10 4 13 4 Z"/>
<path id="flag-flag-shape" d="M 15 7 L 43 13 L 15 27 Z"/>
<clipPath id="flag-flag-clip"><use href="#flag-flag-shape"/></clipPath>
<clipPath id="flag-flag-lit-clip"><use href="#flag-flag-shape" transform="translate(-3 -3)"/></clipPath>
</defs>
<g id="flag-pole">
<use id="flag-pole-fill" href="#flag-pole-shape" fill="#9a6a3a"/>
<use id="flag-pole-line" href="#flag-pole-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="flag-flag">
<use id="flag-flag-shade" href="#flag-flag-shape" fill="#2f5893"/>
<g clip-path="url(#flag-flag-clip)">
<use id="flag-flag-fill" href="#flag-flag-shape" transform="translate(-3 -3)" fill="#3d6fb6"/>
<g clip-path="url(#flag-flag-lit-clip)">
<use id="flag-flag-lit" href="#flag-flag-shape" transform="translate(-3 -3)" fill="#f4f1e4" opacity="0.36"/>
<use id="flag-flag-fill-over" href="#flag-flag-shape" transform="translate(3.6 3.6)" fill="#3d6fb6"/>
</g>
</g>
<use id="flag-flag-line" href="#flag-flag-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
