<svg xmlns="http://www.w3.org/2000/svg" id="hourglass" width="48" height="48" viewBox="0 0 48 48">
<defs>
<path id="hourglass-glass-shape" d="M 12 8 L 36 8 L 26 24 L 36 40 L 12 40 L 22 24 Z"/>
<clipPath id="hourglass-glass-clip"><use href="#hourglass-glass-shape"/></clipPath>
<clipPath id="hourglass-glass-lit-clip"><use href="#hourglass-glass-shape" transform="translate(-3 -3)"/></clipPath>
<path id="hourglass-top-shape" d="M 11 4 L 37 4 Q 40 4 40 7 L 40 8 Q 40 11 37 11 L 11 11 Q 8 11 8 8 L 8 7 Q 8 4 11 4 Z"/>
<path id="hourglass-bottom-shape" d="M 11 37 L 37 37 Q 40 37 40 40 L 40 41 Q 40 44 37 44 L 11 44 Q 8 44 8 41 L 8 40 Q 8 37 11 37 Z"/>
</defs>
<g id="hourglass-glass">
<use id="hourglass-glass-shade" href="#hourglass-glass-shape" fill="#c4b594"/>
<g clip-path="url(#hourglass-glass-clip)">
<use id="hourglass-glass-fill" href="#hourglass-glass-shape" transform="translate(-3 -3)" fill="#e9dfc6"/>
<g clip-path="url(#hourglass-glass-lit-clip)">
<use id="hourglass-glass-lit" href="#hourglass-glass-shape" transform="translate(-3 -3)" fill="#f4f1e4" opacity="0.36"/>
<use id="hourglass-glass-fill-over" href="#hourglass-glass-shape" transform="translate(3.6 3.6)" fill="#e9dfc6"/>
</g>
</g>
<use id="hourglass-glass-line" href="#hourglass-glass-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="hourglass-top">
<use id="hourglass-top-fill" href="#hourglass-top-shape" fill="#9a6a3a"/>
<use id="hourglass-top-line" href="#hourglass-top-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="hourglass-bottom">
<use id="hourglass-bottom-fill" href="#hourglass-bottom-shape" fill="#9a6a3a"/>
<use id="hourglass-bottom-line" href="#hourglass-bottom-shape" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
